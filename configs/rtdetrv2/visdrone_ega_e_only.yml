__include__: [
  '../dataset/visdrone2019_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]

output_dir: ./output/visdrone_ega_e_only

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: True
  return_stage0: True

RTDETR:
  use_ega: True
  stage1_channels: 64
  ega_use_spatial_mask: True
  ega_use_gate: True
  ega_use_aux_branch: False

HybridEncoder:
  in_channels: [128, 256, 512]
  expansion: 0.5

RTDETRTransformerv2:
  num_layers: 3

epoches: 120

train_dataloader:
  total_batch_size: 8
  dataset:
    transforms:
      policy:
        epoch: 117
  collate_fn:
    scales: ~

val_dataloader:
  total_batch_size: 8
