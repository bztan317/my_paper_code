task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 8
remap_mscoco_category: False

RTDETRPostProcessor:
  label2category: [1, 2, 3, 4, 5, 6, 7, 8]

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ../dataset/AITOD/AI-TOD/images/train/
    ann_file: ../dataset/AITOD/AI-TOD/annotations/instances_train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ../dataset/AITOD/AI-TOD-test/
    ann_file: ../dataset/AITOD/AI-TOD/annotations/instances_test.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
